schema: spec-driven

# Project context
context: |
  Aplicación: "Market List" — lista de mercado (compras de alacena, aseo, etc.)

  Stack:
    - Flutter 3.47 (stable), Dart SDK ^3.13.2
    - Estado: flutter_riverpod 2.x (providers reactivos, notifier/stream)
    - DB local: sqflite 2.x (SQLite) — 100% local, SIN uso de internet
    - Migraciones DB: manuales via version + onUpgrade (SQL DDL)
    - Navegación: go_router (rutas con parámetros: /lists/:id)
    - Formatos: intl (moneda es_ES, ej. $1.234,56)

  Entidades de dominio:
    - Product: id, nombre, precio_unitario, tienda
    - ShoppingList: id, tienda, fecha
    - ShoppingListItem: id, id_lista, id_producto, cantidad
    - Costo total de lista = sum(cantidad * precio_unitario)

  Aplicación simplificada, solo en español. UI basada en Material Design
  (sin paquetes visuales extra; solo stock de Flutter).

  Convenciones:
    - Sin dependencias de red (no http/dio)
    - Palabras clave y nombres de pantallas en español (Productos, Listas)
    - Tablas SQL en snake_case; modelos Dart en camelCase

# Per-artifact rules (optional)
rules:
  proposal:
    - No incluir dependencias de red ni servicios remotos (lógica 100% local)
    - Todo cambio de esquema DB debe explicar su migración onUpgrade
  tasks:
    - Separar tareas por capa: datos (sqflite), estado (riverpod), UI/formularios.
    - Incluir verificación con flutter analyze y flutter test por tarea

# Per-operation guidance (optional)
operations:
  apply:
    guidance:
      - Tras cada tarea ejecutar flutter analyze y los tests
      - No crear código de red ni dependencias nuevas sin justificación
  archive:
    guidance:
      - Confirmar que la app compila y los tests pasan antes de archivar